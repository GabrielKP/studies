<div class="container position-absolute top-50 start-50 translate-middle">
  <div class="card text-left">
    <h3 class="card-header text-center">
      Start Screen Recording
    </h3>

    <div class="instructions card-body">
      <p>
        After you click the button below, please follow the instructions to start screen recording your browser window.
      </p>
      <p>
        <ol>
          <li> Allow your browser to share your screen.</li>
          <li> Select the browser window that you are using for the study.</li>
        </ol>
      </p>
      <div class="instructionsnav mt-4">
        <div class="row">
          <div class="col-12 d-flex justify-content-center">
            <button type="button" id="start-recording" class="btn btn-success btn-lg">
              START RECORDING
            </button>
          </div>
        </div>
      </div>

      <p id="recording-status" class="text-center mt-3"></p>
    </div>
  </div>
</div>
